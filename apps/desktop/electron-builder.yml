appId: sh.qwq.sekai
productName: Sekai
artifactName: "Sekai-${version}-${arch}.${ext}"
copyright: Copyright © 2026 Sekai contributors
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - package.json
extraMetadata:
  main: dist/main.cjs
protocols:
  - name: Sekai
    schemes: [sekai]
win:
  target: [nsis, portable]
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
mac:
  target: [dmg, zip]
  category: public.app-category.productivity
  icon: build/icon.png
deb:
  artifactName: "sekai_${version}_${arch}.${ext}"
linux:
  executableName: sekai
  synopsis: Your bots, on your computer
  target: [AppImage, deb]
  category: Utility
  icon: build/icon.png
  maintainer: Sekai contributors
# Updates come from your own Sekai (the app sets the address at runtime); this makes electron-builder write
# latest*.yml for publish:local to copy to the server.
publish:
  - provider: generic
    url: http://localhost:7420/api/desktop/updates
