[versions]
agp = "9.5.1"
kotlin = "2.4.21"
# core 1.19 needs compileSdk 37; the app builds against 36.
core = "1.18.0"
activity = "1.13.0"
# Firebase brings an old Fragment; registerForActivityResult needs 1.3 or later (lint checks it).
fragment = "1.9.1"
lifecycle = "2.11.0"
coroutines = "1.11.0"
webkit = "1.18.0"
browser = "1.10.0"
splashscreen = "1.2.0"
firebaseMessaging = "26.0.2"
junit = "4.13.2"

[libraries]
androidx-core = { module = "androidx.core:core-ktx", version.ref = "core" }
androidx-activity = { module = "androidx.activity:activity-ktx", version.ref = "activity" }
androidx-fragment = { module = "androidx.fragment:fragment-ktx", version.ref = "fragment" }
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }
androidx-browser = { module = "androidx.browser:browser", version.ref = "browser" }
androidx-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "splashscreen" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging", version.ref = "firebaseMessaging" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
