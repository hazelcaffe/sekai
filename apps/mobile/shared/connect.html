<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self'"
		/>
		<title>Connect to Sekai</title>
		<style>
			:root {
				color-scheme: light dark;
				/* Virtual Singers (light) and Nightcord at 25:00 (dark), like the app. */
				--bg: #ffffff;
				--surface: #eef6f5;
				--border: rgb(10 60 56 / 0.12);
				--fg: #0b1716;
				--muted: #4c5f5d;
				--accent: #33ccbb;
				--accent-fg: #03302b;
				--danger: #dc3e42;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--bg: #0d0a10;
					--surface: #15111a;
					--border: rgb(235 215 255 / 0.12);
					--fg: #efe9f4;
					--muted: #a99fb4;
					--accent: #9b54ad;
					--accent-fg: #ffffff;
					--danger: #ff6b6b;
				}
			}
			* {
				box-sizing: border-box;
				-webkit-tap-highlight-color: transparent;
			}
			html,
			body {
				margin: 0;
				min-height: 100%;
				background: var(--bg);
				color: var(--fg);
				font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
			}
			body {
				display: flex;
				justify-content: center;
				padding: calc(env(safe-area-inset-top) + 56px) 24px calc(env(safe-area-inset-bottom) + 24px);
			}
			main {
				width: min(400px, 100%);
				display: flex;
				flex-direction: column;
				gap: 20px;
			}
			header {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 12px;
				text-align: center;
			}
			img {
				width: 88px;
				height: 88px;
			}
			h1 {
				margin: 0;
				font-size: 24px;
				letter-spacing: -0.01em;
			}
			p {
				margin: 0;
				color: var(--muted);
			}
			form {
				display: flex;
				flex-direction: column;
				gap: 12px;
			}
			label {
				font-weight: 600;
				font-size: 14px;
			}
			input {
				height: 52px;
				padding: 0 16px;
				border-radius: 14px;
				border: 1px solid var(--border);
				background: var(--surface);
				color: var(--fg);
				font: 16px ui-monospace, "SF Mono", monospace;
				outline: none;
				width: 100%;
			}
			input:focus {
				border-color: var(--accent);
			}
			button {
				height: 52px;
				border: 0;
				border-radius: 14px;
				background: var(--accent);
				color: var(--accent-fg);
				font: 600 16px system-ui, -apple-system, Roboto, sans-serif;
			}
			button:disabled {
				opacity: 0.55;
			}
			.hint {
				font-size: 14px;
			}
			#error {
				color: var(--danger);
				font-size: 14px;
				min-height: 21px;
			}
			#recent {
				display: none;
				flex-direction: column;
				gap: 8px;
			}
			#recent h2 {
				margin: 8px 0 0;
				font-size: 14px;
				color: var(--muted);
				font-weight: 600;
			}
			#recent button {
				height: 48px;
				background: var(--surface);
				color: var(--fg);
				border: 1px solid var(--border);
				font: 15px ui-monospace, "SF Mono", monospace;
				text-align: left;
				padding: 0 16px;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}
			footer {
				margin-top: auto;
				padding-top: 24px;
				text-align: center;
				font-size: 12px;
				color: var(--muted);
			}
		</style>
	</head>
	<body>
		<main>
			<header>
				<img src="icon.png" alt="" />
				<h1>Connect to Sekai</h1>
				<p id="intro">Enter the address you open Sekai at in your browser.</p>
			</header>
			<form id="form">
				<label for="url">Server address</label>
				<input
					id="url"
					type="url"
					inputmode="url"
					spellcheck="false"
					autocapitalize="off"
					autocomplete="url"
					placeholder="https://sekai.example.com"
				/>
				<p class="hint">Like https://sekai.example.com, or http://192.168.1.20:7420 on your own network.</p>
				<button id="go" type="submit">Connect</button>
				<div id="error" role="alert"></div>
			</form>
			<section id="recent">
				<h2>Recent</h2>
			</section>
			<footer>Sekai <span id="version"></span></footer>
		</main>
		<script>
			// The app's connect bridge: iOS has a message handler, Android a WebMessageListener object.
			const ios = window.webkit?.messageHandlers?.sekaiConnect;
			const android = window.sekaiConnectNative;
			let seq = 0;
			const pending = new Map();
			if (android) {
				android.addEventListener("message", (e) => {
					const msg = JSON.parse(e.data);
					const p = pending.get(msg.id);
					if (!p) return;
					pending.delete(msg.id);
					if (msg.error) p.reject(new Error(msg.error));
					else p.resolve(msg.result);
				});
			}
			function call(method, args = {}) {
				if (ios) return ios.postMessage({ method, args });
				if (!android) return Promise.reject(new Error("Open this in the Sekai app"));
				return new Promise((resolve, reject) => {
					const id = ++seq;
					pending.set(id, { resolve, reject });
					android.postMessage(JSON.stringify({ id, method, args }));
				});
			}

			const input = document.getElementById("url");
			const button = document.getElementById("go");
			const error = document.getElementById("error");

			async function connect(url) {
				button.disabled = true;
				button.textContent = "Connecting…";
				error.textContent = "";
				try {
					// The app checks the address is a Sekai server, saves it and opens it.
					const result = await call("connect", { url });
					if (!result?.ok) throw new Error(result?.error || "Couldn't connect.");
				} catch (err) {
					error.textContent = err.message || String(err);
					button.disabled = false;
					button.textContent = "Connect";
				}
			}

			document.getElementById("form").addEventListener("submit", (e) => {
				e.preventDefault();
				const url = input.value.trim();
				if (!url) {
					error.textContent = "Enter your server's address first.";
					return;
				}
				void connect(url);
			});

			call("state")
				.then((state) => {
					// state: { serverUrl, recent: string[], problem: string | null, version }
					if (state.serverUrl) input.value = state.serverUrl;
					if (state.problem) error.textContent = state.problem;
					if (state.version) document.getElementById("version").textContent = state.version;
					const recent = (state.recent || []).filter((u) => u !== state.serverUrl).slice(0, 5);
					if (recent.length) {
						const box = document.getElementById("recent");
						box.style.display = "flex";
						for (const url of recent) {
							const b = document.createElement("button");
							b.type = "button";
							b.textContent = url;
							b.addEventListener("click", () => {
								input.value = url;
								void connect(url);
							});
							box.appendChild(b);
						}
					}
				})
				.catch(() => {});
		</script>
	</body>
</html>
