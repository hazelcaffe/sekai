name: Release

# Push a tag like v0.2.0: the Docker image goes to GitHub's container registry (ghcr.io/<owner>/<repo>), for amd64
# and arm64, and a GitHub release is made with notes from the merged pull requests.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  check:
    name: Check before releasing
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: sekai
          POSTGRES_PASSWORD: sekai
          POSTGRES_DB: sekai
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U sekai -d sekai"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgres://sekai:sekai@127.0.0.1:5433/sekai
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check

  image:
    name: Docker image
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  release:
    name: GitHub release
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
