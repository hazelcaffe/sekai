name: Release

# Push a tag like v0.2.0 (or v0.2.0-beta.1 for a pre-release) and this:
# - checks everything, as CI does;
# - publishes the server's Docker image to GitHub's container registry (ghcr.io/<owner>/<repo>, amd64 and arm64);
# - builds the desktop app for Windows, macOS and Linux, and the phone apps (a signed Android APK, an unsigned
#   iOS .ipa);
# - makes a GitHub release with all of them, their SHA-256 checksums, and notes.
# Run it by hand (Actions → Release → Run workflow) to build everything without publishing: the files are then
# the run's artifacts.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  # electron-builder downloads Electron itself when it packages the desktop app.
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      base: ${{ steps.v.outputs.base }}
      build: ${{ steps.v.outputs.build }}
      publish: ${{ steps.v.outputs.publish }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN: ${{ github.run_number }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            version="${REF_NAME#v}"
            publish=true
          else
            version="$(jq -r .version package.json)-dev.$RUN"
            publish=false
          fi
          if ! [[ $version =~ ^([0-9]+\.[0-9]+\.[0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tags look like v1.2.3 or v1.2.3-beta.1."
            exit 1
          fi
          {
            echo "version=$version"
            # The phone apps take plain numbers: 1.2.3, and a build number that only goes up.
            echo "base=${BASH_REMATCH[1]}"
            echo "build=$RUN"
            echo "publish=$publish"
            echo "prerelease=$([ -n "${BASH_REMATCH[2]}" ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"
          echo "Building $version (build $RUN)"

  check:
    name: Check before releasing
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: sekai
          POSTGRES_PASSWORD: sekai
          POSTGRES_DB: sekai
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U sekai -d sekai"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgres://sekai:sekai@127.0.0.1:5433/sekai
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check

  image:
    name: Docker image
    needs: [version, check]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.version.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ needs.version.outputs.prerelease == 'false' }}
      - id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  desktop:
    name: Desktop (${{ matrix.name }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: --win --x64
          # Not notarized: signed ad hoc, so macOS asks once ("Open anyway") instead of calling it damaged.
          - name: macOS
            os: macos-latest
            args: --mac --x64 --arm64 -c.mac.identity=- -c.mac.hardenedRuntime=false
          - name: Linux
            os: ubuntu-latest
            args: --linux --x64 --arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Build the installers
        working-directory: apps/desktop
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          ARGS: ${{ matrix.args }}
        run: |
          bun run build
          # shellcheck disable=SC2086 # ARGS is a list of options
          bunx electron-builder --config electron-builder.yml $ARGS --publish never -c.extraMetadata.version="$VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.name }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
          if-no-files-found: error

  mobile:
    name: Phone apps
    needs: version
    uses: ./.github/workflows/mobile.yml
    with:
      version: ${{ needs.version.outputs.base }}
      build: ${{ fromJSON(needs.version.outputs.build) }}
    secrets: inherit

  release:
    name: GitHub release
    needs: [version, image, desktop, mobile]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: desktop-*
          path: files
          merge-multiple: true
      - uses: actions/download-artifact@v7
        with:
          name: sekai-android
          path: files
      - uses: actions/download-artifact@v7
        with:
          name: sekai-ios
          path: files
      - name: Checksums and notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          (cd files && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          sed -e "s|{version}|$VERSION|g" -e "s|{repo}|$REPO|g" .github/release-notes.md > "$RUNNER_TEMP/notes.md"
      - uses: softprops/action-gh-release@v3
        with:
          name: Sekai ${{ needs.version.outputs.version }}
          body_path: ${{ runner.temp }}/notes.md
          generate_release_notes: true
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          files: files/*
          fail_on_unmatched_files: true
