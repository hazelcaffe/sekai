version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    # Updates land on dev with everything else new, and reach main with the next release.
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: bun
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
